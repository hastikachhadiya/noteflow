<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes · NoteFlow</title>
  <meta name="description" content="NoteFlow — a local-first note tracking app. Search, filter, pin, colour and tag your notes.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint — prevents a flash */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('noteflow:theme') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default to dark */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="min-h-screen text-[var(--nf-ink)] antialiased">

  <div id="nf-nav"></div>
  <div id="nf-backdrop" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden"></div>

  <div class="mx-auto flex w-full max-w-7xl gap-6 px-4 py-6 sm:px-6">
    <div id="nf-sidebar"></div>

    <main id="nf-main" class="min-w-0 flex-1">
      <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-tight" data-i18n="index.title">Notes</h1>
          <p class="text-sm text-[var(--nf-ink-soft)]" data-i18n="index.subtitle">Everything you have captured, in one place.</p>
        </div>
        <a href="note-editor.html" class="nf-btn nf-btn-primary">
          <i data-lucide="plus" class="h-4 w-4"></i>
          <span data-i18n="index.new">New note</span>
        </a>
      </header>

      <!-- Search + filters -->
      <section class="nf-card mb-5 p-3 sm:p-4" aria-label="Search and filters">
        <div class="relative mb-3">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--nf-ink-soft)]">
            <i data-lucide="search" class="h-4 w-4"></i>
          </span>
          <input id="nf-search" type="search" class="nf-input pl-9" data-i18n-placeholder="index.search"
                 placeholder="Search notes…" aria-label="Search notes">
        </div>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">
          <select id="f-category" class="nf-input" aria-label="Filter by category"></select>
          <select id="f-colour" class="nf-input" aria-label="Filter by colour"></select>
          <select id="f-tag" class="nf-input" aria-label="Filter by tag"></select>
          <select id="f-pin" class="nf-input" aria-label="Filter by pinned"></select>
          <select id="f-sort" class="nf-input col-span-2 sm:col-span-1" aria-label="Sort notes"></select>
        </div>
      </section>

      <!-- Notes grid -->
      <section id="nf-grid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-live="polite" aria-label="Notes"></section>
    </main>
  </div>

  <footer id="nf-footer"></footer>
  <div id="nf-modal-root"></div>

  <script type="module">
    import { initLayout, updateSidebarCounts } from './js/layout.js';
    import {
      getNotes, queryNotes, sortNotes, allTags, CATEGORIES, COLOURS,
      togglePin, archiveNote, trashNote, subscribe,
    } from './js/notes.js';
    import { el, icons, toast, emptyState, skeletons, buildNoteCard, debounce, confirmDialog } from './js/ui.js';
    import { t } from './js/i18n.js';

    initLayout('notes');

    const grid = document.getElementById('nf-grid');
    const state = { q: '', category: 'all', colour: 'all', tag: 'all', pin: 'all', sort: 'updated-desc' };

    /* ---------------- filter selects ---------------- */
    function fillSelect(select, options, current) {
      select.replaceChildren(...options.map((o) => el('option', { value: o.value, text: o.label })));
      select.value = current;
    }

    function refreshTagSelect() {
      const tags = allTags(getNotes());
      const keep = tags.includes(state.tag) ? state.tag : 'all';
      fillSelect(
        document.getElementById('f-tag'),
        [{ value: 'all', label: t('index.allTags') }, ...tags.map((tag) => ({ value: tag, label: `#${tag}` }))],
        keep,
      );
      state.tag = keep;
    }

    fillSelect(document.getElementById('f-category'),
      [{ value: 'all', label: t('index.allCategories') }, ...CATEGORIES.map((c) => ({ value: c, label: c }))], state.category);
    fillSelect(document.getElementById('f-colour'),
      [{ value: 'all', label: t('index.allColours') }, ...COLOURS.map((c) => ({ value: c.id, label: c.id }))], state.colour);
    fillSelect(document.getElementById('f-pin'),
      [
        { value: 'all', label: t('index.allPins') },
        { value: 'pinned', label: t('index.pinOnly') },
        { value: 'unpinned', label: t('index.unpinOnly') },
      ], state.pin);
    fillSelect(document.getElementById('f-sort'),
      [
        { value: 'updated-desc', label: t('index.sortUpdatedDesc') },
        { value: 'updated-asc', label: t('index.sortUpdatedAsc') },
        { value: 'created-desc', label: t('index.sortCreatedDesc') },
        { value: 'title-asc', label: t('index.sortTitleAsc') },
        { value: 'title-desc', label: t('index.sortTitleDesc') },
      ], state.sort);
    refreshTagSelect();

    /* ---------------- rendering ---------------- */
    function render() {
      const notes = sortNotes(queryNotes(getNotes(), state), state.sort);
      grid.replaceChildren();
      if (!notes.length) {
        emptyState(grid, { icon: 'sticky-note', title: t('index.emptyTitle'), msg: t('index.emptyMsg') });
        icons();
        return;
      }
      for (const note of notes) {
        grid.append(buildNoteCard(note, {
          onPin: () => { togglePin(note.id); toast(t(note.pinned ? 'toast.unpinned' : 'toast.pinned')); },
          onArchive: () => { archiveNote(note.id); toast(t('toast.archived')); },
          onTrash: async () => {
            const ok = await confirmDialog({
              title: t('confirm.trashTitle'),
              message: t('confirm.trashMsg'),
              confirmText: t('action.trash'),
              danger: true,
            });
            if (ok) { trashNote(note.id); toast(t('toast.trashed')); }
          },
        }));
      }
      icons();
    }

    /* ---------------- events ---------------- */
    document.getElementById('nf-search').addEventListener('input', debounce((e) => {
      state.q = e.target.value;
      render();
    }, 250));

    for (const [id, key] of [['f-category', 'category'], ['f-colour', 'colour'], ['f-tag', 'tag'], ['f-pin', 'pin'], ['f-sort', 'sort']]) {
      document.getElementById(id).addEventListener('change', (e) => {
        state[key] = e.target.value;
        render();
      });
    }

    /* initial load: brief skeleton, then render */
    skeletons(grid, 6);
    setTimeout(render, 350);

    subscribe(() => { refreshTagSelect(); render(); updateSidebarCounts(); });
  </script>
</body>
</html>
