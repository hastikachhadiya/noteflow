<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · NoteFlow</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint — prevents a flash */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('noteflow:theme') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default to dark */ }
    })();
  </script>
  <style>
    /* Declare cascade layers BEFORE Tailwind loads: our styles sit in `nf`,
       above Tailwind's base/preflight but below its utilities — so Tailwind
       utility classes (hidden, pl-9, …) can override our component styles. */
    @layer theme, base, components, nf;
    @layer nf {
    /* ============ NoteFlow shared theme (identical on every page) ============ */
    :root {
      --nf-brand: #10b981;
      --nf-brand-soft: rgba(16, 185, 129, .15);
      --nf-danger: #e11d48;
      --nf-bg: #eef2f5;
      --nf-card: rgba(255, 255, 255, .72);
      --nf-card-solid: #ffffff;
      --nf-line: rgba(15, 23, 42, .10);
      --nf-ink: #0f172a;
      --nf-ink-soft: #5c6c7d;
      color-scheme: light;
    }
    .dark {
      --nf-bg: #070b11;
      --nf-card: rgba(255, 255, 255, .05);
      --nf-card-solid: #0f1a23;
      --nf-line: rgba(148, 163, 184, .16);
      --nf-ink: #e6edf3;
      --nf-ink-soft: #93a5b8;
      color-scheme: dark;
    }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 85% -10%, rgba(16, 185, 129, .16), transparent 60%),
        radial-gradient(900px 480px at -10% 110%, rgba(14, 165, 233, .10), transparent 55%),
        var(--nf-bg);
      background-attachment: fixed;
    }
    .nf-card { background: var(--nf-card); border: 1px solid var(--nf-line); border-radius: 1rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .nf-btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border-radius: .65rem; border: 1px solid transparent; padding: .55rem .95rem; font-size: .875rem; font-weight: 600; cursor: pointer; transition: filter .15s; }
    .nf-btn-primary { background: var(--nf-brand); color: #052e22; }
    .nf-btn-primary:hover { filter: brightness(1.1); }
    :focus-visible { outline: 2px solid var(--nf-brand); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
    }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="grid min-h-screen place-items-center p-6 text-[var(--nf-ink)] antialiased">

  <main class="nf-card w-full max-w-md p-10 text-center">
    <p class="text-6xl font-extrabold tracking-tight" style="color:var(--nf-brand)" data-i18n="nf404.code">404</p>
    <h1 class="mt-3 text-xl font-bold" data-i18n="nf404.title">Page not found</h1>
    <p class="mt-2 text-sm text-[var(--nf-ink-soft)]" data-i18n="nf404.msg">
      The page you are looking for does not exist or was moved.
    </p>
    <a href="index.html" class="nf-btn nf-btn-primary mt-6" data-i18n="nf404.cta">Back to Notes</a>
  </main>

  <script type="module">
    import { applyI18n } from './js/i18n.js';
    applyI18n();
    if (window.lucide?.createIcons) window.lucide.createIcons();
  </script>
</body>
</html>
