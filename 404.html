<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · NoteFlow</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint — prevents a flash */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('noteflow:theme') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default to dark */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="grid min-h-screen place-items-center p-6 text-[var(--nf-ink)] antialiased">

  <main class="nf-card w-full max-w-md p-10 text-center">
    <p class="text-6xl font-extrabold tracking-tight" style="color:var(--nf-brand)" data-i18n="nf404.code">404</p>
    <h1 class="mt-3 text-xl font-bold" data-i18n="nf404.title">Page not found</h1>
    <p class="mt-2 text-sm text-[var(--nf-ink-soft)]" data-i18n="nf404.msg">
      The page you are looking for does not exist or was moved.
    </p>
    <a href="index.html" class="nf-btn nf-btn-primary mt-6" data-i18n="nf404.cta">Back to Notes</a>
  </main>

  <script type="module">
    import { applyI18n } from './js/i18n.js';
    applyI18n();
    if (window.lucide?.createIcons) window.lucide.createIcons();
  </script>
</body>
</html>
