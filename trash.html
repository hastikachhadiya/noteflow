<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trash · NoteFlow</title>
  <meta name="description" content="Trash in NoteFlow — restore deleted notes or remove them permanently.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint — prevents a flash */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('noteflow:theme') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default to dark */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="min-h-screen text-[var(--nf-ink)] antialiased">

  <div id="nf-nav"></div>
  <div id="nf-backdrop" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden"></div>

  <div class="mx-auto flex w-full max-w-7xl gap-6 px-4 py-6 sm:px-6">
    <div id="nf-sidebar"></div>

    <main id="nf-main" class="min-w-0 flex-1">
      <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-tight" data-i18n="trash.title">Trash</h1>
          <p class="text-sm text-[var(--nf-ink-soft)]" data-i18n="trash.subtitle">Deleted notes are kept here until you remove them for good.</p>
        </div>
        <button id="nf-empty" type="button" class="nf-btn nf-btn-danger">
          <i data-lucide="trash-2" class="h-4 w-4"></i>
          <span data-i18n="trash.emptyBtn">Empty trash</span>
        </button>
      </header>
      <section id="nf-grid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-live="polite" aria-label="Trashed notes"></section>
    </main>
  </div>

  <footer id="nf-footer"></footer>
  <div id="nf-modal-root"></div>

  <script type="module">
    import { initLayout, updateSidebarCounts } from './js/layout.js';
    import { getNotes, restoreNote, purgeNote, emptyTrash, subscribe } from './js/notes.js';
    import { icons, toast, emptyState, skeletons, buildNoteCard, confirmDialog } from './js/ui.js';
    import { t } from './js/i18n.js';

    initLayout('trash');
    const grid = document.getElementById('nf-grid');

    function render() {
      // Trash page reads raw notes (queryNotes always excludes trashed)
      const notes = getNotes().filter((n) => n.trashed).sort((a, b) => b.updatedAt - a.updatedAt);
      grid.replaceChildren();
      if (!notes.length) {
        emptyState(grid, { icon: 'trash-2', title: t('trash.emptyTitle'), msg: t('trash.emptyMsg') });
        icons();
        return;
      }
      for (const note of notes) {
        grid.append(buildNoteCard(note, {
          onRestore: () => { restoreNote(note.id); toast(t('toast.restored')); },
          onPurge: async () => {
            const ok = await confirmDialog({
              title: t('confirm.purgeTitle'),
              message: t('confirm.purgeMsg'),
              confirmText: t('action.purge'),
              danger: true,
            });
            if (ok) { purgeNote(note.id); toast(t('toast.deleted')); }
          },
        }));
      }
      icons();
    }

    document.getElementById('nf-empty').addEventListener('click', async () => {
      if (!getNotes().some((n) => n.trashed)) return;
      const ok = await confirmDialog({
        title: t('confirm.emptyTitle'),
        message: t('confirm.emptyMsg'),
        confirmText: t('action.purge'),
        danger: true,
      });
      if (ok) { emptyTrash(); toast(t('toast.deleted')); }
    });

    skeletons(grid, 4);
    setTimeout(render, 350);
    subscribe(() => { render(); updateSidebarCounts(); });
  </script>
</body>
</html>
