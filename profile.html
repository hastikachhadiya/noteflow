<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · NoteFlow</title>
  <meta name="description" content="Your NoteFlow stats and data tools — export, import and manage your local notes.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint — prevents a flash */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('noteflow:theme') || 'null');
        var dark = saved === 'dark' || (saved !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default to dark */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="min-h-screen text-[var(--nf-ink)] antialiased">

  <div id="nf-nav"></div>
  <div id="nf-backdrop" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden"></div>

  <div class="mx-auto flex w-full max-w-7xl gap-6 px-4 py-6 sm:px-6">
    <div id="nf-sidebar"></div>

    <main id="nf-main" class="min-w-0 flex-1">
      <header class="mb-5">
        <h1 class="text-2xl font-bold tracking-tight" data-i18n="profile.title">Profile</h1>
        <p class="text-sm text-[var(--nf-ink-soft)]" data-i18n="profile.subtitle">A quick look at your notes and your data tools.</p>
      </header>

      <!-- Stats -->
      <section class="mb-4 grid grid-cols-2 gap-4 lg:grid-cols-4" aria-label="Statistics">
        <div class="nf-card p-4">
          <i data-lucide="sticky-note" class="h-5 w-5" style="color:var(--nf-brand)"></i>
          <p id="stat-total" class="mt-2 text-3xl font-extrabold">0</p>
          <p class="text-xs font-medium text-[var(--nf-ink-soft)]" data-i18n="profile.total">Active notes</p>
        </div>
        <div class="nf-card p-4">
          <i data-lucide="pin" class="h-5 w-5" style="color:var(--nf-brand)"></i>
          <p id="stat-pinned" class="mt-2 text-3xl font-extrabold">0</p>
          <p class="text-xs font-medium text-[var(--nf-ink-soft)]" data-i18n="profile.pinned">Pinned</p>
        </div>
        <div class="nf-card p-4">
          <i data-lucide="archive" class="h-5 w-5" style="color:var(--nf-brand)"></i>
          <p id="stat-archived" class="mt-2 text-3xl font-extrabold">0</p>
          <p class="text-xs font-medium text-[var(--nf-ink-soft)]" data-i18n="profile.archived">Archived</p>
        </div>
        <div class="nf-card p-4">
          <i data-lucide="trash-2" class="h-5 w-5" style="color:var(--nf-brand)"></i>
          <p id="stat-trashed" class="mt-2 text-3xl font-extrabold">0</p>
          <p class="text-xs font-medium text-[var(--nf-ink-soft)]" data-i18n="profile.trashed">In trash</p>
        </div>
      </section>

      <!-- Data tools -->
      <section class="nf-card mb-4 p-5">
        <h2 class="text-base font-semibold" data-i18n="profile.dataTitle">Your data</h2>
        <p class="mt-1 text-sm text-[var(--nf-ink-soft)]" data-i18n="profile.dataHint">
          Export all notes to a JSON file, or import a previous backup.
        </p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button id="nf-export" type="button" class="nf-btn nf-btn-primary">
            <i data-lucide="download" class="h-4 w-4"></i>
            <span data-i18n="profile.export">Export JSON</span>
          </button>
          <button id="nf-import-btn" type="button" class="nf-btn nf-btn-ghost">
            <i data-lucide="upload" class="h-4 w-4"></i>
            <span data-i18n="profile.import">Import JSON</span>
          </button>
          <input id="nf-import" type="file" accept="application/json,.json" class="hidden" aria-label="Import JSON file">
        </div>
      </section>

      <!-- Danger zone -->
      <section class="nf-card p-5" style="border-color:rgba(225,29,72,.4)">
        <h2 class="text-base font-semibold" style="color:var(--nf-danger)" data-i18n="profile.dangerTitle">Danger zone</h2>
        <p class="mt-1 text-sm text-[var(--nf-ink-soft)]" data-i18n="profile.dangerHint">Irreversible actions — please be certain.</p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button id="nf-clear" type="button" class="nf-btn nf-btn-danger">
            <i data-lucide="shield-x" class="h-4 w-4"></i>
            <span data-i18n="profile.clear">Clear all data</span>
          </button>
          <button id="nf-samples" type="button" class="nf-btn nf-btn-ghost">
            <i data-lucide="sprout" class="h-4 w-4"></i>
            <span data-i18n="profile.samples">Restore sample notes</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <footer id="nf-footer"></footer>
  <div id="nf-modal-root"></div>

  <script type="module">
    import { initLayout, updateSidebarCounts } from './js/layout.js';
    import { getNotes, counts, clearAllNotes, importNotes, ensureSeed, subscribe } from './js/notes.js';
    import { el, icons, toast, dialog, confirmDialog } from './js/ui.js';
    import { t } from './js/i18n.js';

    initLayout('profile');

    /* ---------------- stats ---------------- */
    function renderStats() {
      const c = counts();
      document.getElementById('stat-total').textContent = String(c.total);
      document.getElementById('stat-pinned').textContent = String(c.pinned);
      document.getElementById('stat-archived').textContent = String(c.archived);
      document.getElementById('stat-trashed').textContent = String(c.trashed);
    }
    renderStats();
    subscribe(() => { renderStats(); updateSidebarCounts(); });

    /* ---------------- export ---------------- */
    document.getElementById('nf-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(getNotes(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = el('a', { href: url, download: `noteflow-notes-${new Date().toISOString().slice(0, 10)}.json` });
      link.click();
      URL.revokeObjectURL(url);
      toast(t('toast.exported'));
    });

    /* ---------------- import ---------------- */
    const fileInput = document.getElementById('nf-import');
    document.getElementById('nf-import-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      fileInput.value = ''; // allow re-selecting the same file
      if (!file) return;

      let raw;
      try {
        raw = JSON.parse(await file.text());
      } catch {
        toast(t('toast.importFailed'), 'error');
        return;
      }
      if (!Array.isArray(raw)) {
        toast(t('toast.importFailed'), 'error');
        return;
      }
      if (!raw.some((item) => item && typeof item.title === 'string' && typeof item.content === 'string')) {
        toast(t('toast.importEmpty'), 'error');
        return;
      }

      const mode = await dialog({
        title: t('profile.importTitle'),
        message: t('profile.importMsg'),
        actions: [
          { label: t('profile.merge'), value: 'merge', style: 'primary' },
          { label: t('profile.replace'), value: 'replace', style: 'danger' },
        ],
      });
      if (!mode) return;

      const imported = importNotes(raw, mode);
      if (imported > 0) toast(t('toast.imported', { count: imported }));
      else toast(t('toast.importEmpty'), 'error');
    });

    /* ---------------- danger zone ---------------- */
    document.getElementById('nf-clear').addEventListener('click', async () => {
      const ok = await confirmDialog({
        title: t('confirm.clearTitle'),
        message: t('confirm.clearMsg'),
        confirmText: t('profile.clear'),
        danger: true,
      });
      if (ok) { clearAllNotes(); toast(t('toast.cleared')); }
    });

    document.getElementById('nf-samples').addEventListener('click', () => {
      ensureSeed(true);
      toast(t('toast.seeded'));
    });

    icons();
  </script>
</body>
</html>
